<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>♪ 專屬歌曲</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --border: rgba(255,255,255,0.07);
      --accent: #c8a96e;
      --accent-soft: rgba(200,169,110,0.12);
      --text: #e8e4dc;
      --text-muted: #6b6b7a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient background orbs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 320px; height: 320px;
      background: radial-gradient(circle, rgba(200,169,110,0.08) 0%, transparent 70%);
      top: -60px; right: -60px;
      animation: drift1 8s ease-in-out infinite alternate;
    }
    body::after {
      width: 260px; height: 260px;
      background: radial-gradient(circle, rgba(100,80,200,0.06) 0%, transparent 70%);
      bottom: -40px; left: -40px;
      animation: drift2 10s ease-in-out infinite alternate;
    }

    @keyframes drift1 { to { transform: translate(20px, 30px); } }
    @keyframes drift2 { to { transform: translate(-15px, -25px); } }

    .card {
      position: relative;
      z-index: 1;
      width: min(88vw, 360px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 28px 32px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.03);
      animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-ring {
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 1px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      position: relative;
    }
    .logo-ring::before {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 1px solid rgba(200,169,110,0.2);
    }
    .logo-ring svg { width: 22px; height: 22px; color: var(--accent); }

    .title-serif {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 1.65rem;
      letter-spacing: 0.02em;
      text-align: center;
      color: var(--text);
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 6px;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 24px 0;
    }

    /* --- Input Section --- */
    label {
      display: block;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    input[type="url"] {
      width: 100%;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 14px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="url"]::placeholder { color: var(--text-muted); }
    input[type="url"]:focus {
      border-color: rgba(200,169,110,0.5);
      box-shadow: 0 0 0 3px rgba(200,169,110,0.08);
    }

    .url-hint {
      margin-top: 8px;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .btn-save {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: var(--accent);
      color: #0a0a0f;
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      position: relative;
      overflow: hidden;
    }
    .btn-save:active { transform: scale(0.98); }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-save .btn-text { display: block; }

    /* --- Playing Section --- */
    .playing-wrap { text-align: center; }

    .vinyl {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: conic-gradient(
        #1a1a1a 0deg, #2a2a2a 60deg, #1a1a1a 120deg,
        #2a2a2a 180deg, #1a1a1a 240deg, #2a2a2a 300deg, #1a1a1a 360deg
      );
      margin: 0 auto 20px;
      position: relative;
      display: flex; align-items: center; justify-content: center;
      animation: spin 3s linear infinite;
      box-shadow: 0 0 0 2px rgba(200,169,110,0.3), 0 8px 24px rgba(0,0,0,0.5);
    }
    .vinyl::after {
      content: '';
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--bg);
      border: 2px solid var(--accent);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .playing-label {
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .playing-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-weight: 300;
      color: var(--text);
      margin-bottom: 6px;
    }
    .playing-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .progress-bar {
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 24px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      animation: progress 1.5s linear forwards;
    }
    @keyframes progress { from { width: 0%; } to { width: 100%; } }

    /* --- Loading / Error --- */
    .loading-dots span {
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent);
      margin: 0 3px;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); opacity: 0.4; }
      40%          { transform: translateY(-6px); opacity: 1; }
    }

    .msg-error {
      font-size: 0.82rem;
      color: #e07070;
      text-align: center;
      margin-top: 12px;
      min-height: 18px;
    }
    .msg-success {
      font-size: 0.82rem;
      color: #70c090;
      text-align: center;
      margin-top: 12px;
    }

    /* Util */
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="card" id="card">

  <!-- ── 載入中 ── -->
  <div id="view-loading" class="text-center py-4">
    <div class="logo-ring mb-5">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      </svg>
    </div>
    <div class="loading-dots mt-2">
      <span></span><span></span><span></span>
    </div>
    <p class="subtitle mt-4">讀取中</p>
  </div>

  <!-- ── 首次使用：綁定歌曲 ── -->
  <div id="view-bind" class="hidden">
    <div class="logo-ring">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      </svg>
    </div>
    <h1 class="title-serif">綁定您的歌曲</h1>
    <p class="subtitle mt-1">這張卡片尚未連結音樂</p>

    <div class="divider"></div>

    <label for="url-input">Spotify 或 YouTube 連結</label>
    <div class="input-wrap">
      <input
        type="url"
        id="url-input"
        placeholder="貼上歌曲連結…"
        autocomplete="off"
        spellcheck="false"
      />
    </div>
    <p class="url-hint">支援 Spotify、YouTube、Apple Music 等連結</p>

    <button class="btn-save" id="btn-save" onclick="saveSong()">
      <span class="btn-text">儲存並完成綁定</span>
    </button>
    <p class="msg-error hidden" id="msg-error"></p>
  </div>

  <!-- ── 已有歌曲：自動跳轉 ── -->
  <div id="view-playing" class="hidden playing-wrap">
    <div class="vinyl"></div>
    <p class="playing-label">正在為您播放</p>
    <p class="playing-title">專屬歌曲</p>
    <p class="playing-sub" id="playing-url-hint">即將跳轉…</p>
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
  </div>

  <!-- ── 儲存成功 ── -->
  <div id="view-success" class="hidden text-center py-2">
    <div style="font-size:2.4rem; margin-bottom:12px;">✓</div>
    <h1 class="title-serif">綁定成功</h1>
    <p class="playing-sub mt-2">下次感應此卡片，<br>將直接播放您的歌曲。</p>
  </div>

  <!-- ── 錯誤 ── -->
  <div id="view-error" class="hidden text-center py-2">
    <div style="font-size:2rem; margin-bottom:12px; color:#e07070;">✕</div>
    <h1 class="title-serif" style="color:#e07070">發生錯誤</h1>
    <p class="playing-sub mt-2" id="error-detail">請稍後再試</p>
  </div>

</div><!-- /card -->

<script>
  // ═══════════════════════════════════════════
  //  ⚙️  請修改以下兩行為你的 Supabase 設定
  // ═══════════════════════════════════════════
  const SUPABASE_URL = 'https://https://byvyhjobgsgqcekbkppw.supabase.co/rest/v1/';   // ← 替換
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ5dnloam9iZ3NncWNla2JrcHB3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNDE5NDQsImV4cCI6MjA5NTcxNzk0NH0.6voD0rUtu_UvRl03dJH6rTg1MVCcB7XV7J5IwRIx7xY'; // ← 替換
  const TABLE_NAME = 'nfc_songs'; // Supabase 資料表名稱
  // ═══════════════════════════════════════════

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // 取得 URL 中的 id 參數
  const params = new URLSearchParams(location.search);
  const nfcId = params.get('id');

  function showView(name) {
    ['loading','bind','playing','success','error'].forEach(v =>
      document.getElementById('view-' + v).classList.toggle('hidden', v !== name)
    );
  }

  async function init() {
    if (!nfcId) {
      showView('error');
      document.getElementById('error-detail').textContent = '連結中缺少 NFC ID，請確認卡片設定。';
      return;
    }

    try {
      const { data, error } = await db
        .from(TABLE_NAME)
        .select('song_url')
        .eq('nfc_id', nfcId)
        .maybeSingle();

      if (error) throw error;

      if (data && data.song_url) {
        // 已綁定 → 顯示播放畫面並跳轉
        showView('playing');
        const hint = new URL(data.song_url);
        document.getElementById('playing-url-hint').textContent = hint.hostname;
        setTimeout(() => {
          window.location.href = data.song_url;
        }, 1500);
      } else {
        // 尚未綁定 → 顯示綁定表單
        showView('bind');
      }
    } catch (err) {
      showView('error');
      document.getElementById('error-detail').textContent = err.message || '資料庫連線失敗';
    }
  }

  async function saveSong() {
    const input = document.getElementById('url-input');
    const btn   = document.getElementById('btn-save');
    const errEl = document.getElementById('msg-error');

    const url = input.value.trim();
    errEl.classList.add('hidden');

    // 基本驗證
    if (!url) {
      errEl.textContent = '請貼上歌曲連結';
      errEl.classList.remove('hidden');
      return;
    }
    try { new URL(url); } catch {
      errEl.textContent = '連結格式不正確，請重新貼上';
      errEl.classList.remove('hidden');
      return;
    }

    btn.disabled = true;
    btn.querySelector('.btn-text').textContent = '儲存中…';

    try {
      const { error } = await db
        .from(TABLE_NAME)
        .upsert({ nfc_id: nfcId, song_url: url }, { onConflict: 'nfc_id' });

      if (error) throw error;
      showView('success');
    } catch (err) {
      btn.disabled = false;
      btn.querySelector('.btn-text').textContent = '儲存並完成綁定';
      errEl.textContent = '儲存失敗：' + (err.message || '請重試');
      errEl.classList.remove('hidden');
    }
  }

  init();
</script>
</body>
</html>
